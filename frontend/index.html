<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ClipThis</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #15161c;
    --surface: #1b1d26;
    --surface-2: #21232e;
    --border: #2b2e3b;
    --text: #e8e9ee;
    --muted: #8d92a5;
    --accent: #5b8cff;
    --accent-soft: rgba(91, 140, 255, 0.14);
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; width: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  ::-webkit-scrollbar { width: 0; height: 0; display: none; }

  .app { display: flex; flex-direction: column; height: 100%; }

  .titlebar {
    display: flex; align-items: center; gap: 10px;
    height: 40px; padding: 0 8px 0 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .titlebar .brand { font-size: 12.5px; font-weight: 600; letter-spacing: .2px; }
  .titlebar .spacer { flex: 1; height: 100%; }
  .iconbtn {
    width: 30px; height: 26px; border: 1px solid transparent; border-radius: 7px;
    background: transparent; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .iconbtn:hover { background: var(--surface-2); color: var(--text); }
  .iconbtn svg { width: 14px; height: 14px; }

  .tabs {
    display: flex; gap: 0; padding: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1; border: none; background: transparent; color: var(--muted);
    font: inherit; font-size: 12px; padding: 8px 0; cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .12s, border-color .12s;
  }
  .tab:hover { color: var(--text); }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  .panel { flex: 1; padding: 10px 14px; overflow-y: auto; display: none; flex-direction: column; gap: 2px; }
  .panel.on { display: flex; }

  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: var(--radius);
  }
  .row:hover { background: rgba(255,255,255,0.025); }
  .row .lead {
    width: 120px; flex: 0 0 120px;
    font-size: 12.5px; font-weight: 500;
  }
  .row .lead small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 400; margin-top: 1px; }
  .row .ctl { flex: 1; min-width: 0; display: flex; justify-content: flex-end; align-items: center; gap: 6px; }

  input[type="text"], select {
    width: 100%; height: 30px; padding: 0 10px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    font: inherit; font-size: 12px; outline: none;
  }
  input[type="text"]:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type="text"]::placeholder { color: #6a6f80; }
  input[type="text"][readonly] { cursor: pointer; }
  select {
    appearance: none; padding-right: 28px; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6' fill='none' stroke='%238d92a5' stroke-width='1.6'><path d='M1 1l4 4 4-4'/></svg>");
    background-repeat: no-repeat; background-position: right 10px center;
  }

  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; }
  .seg button {
    border: none; background: transparent; color: var(--muted);
    font: inherit; font-size: 11px; padding: 4px 7px; border-radius: 6px; cursor: pointer;
  }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }

  .switch {
    position: relative; width: 38px; height: 21px; flex: 0 0 38px;
    border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-2); cursor: pointer; padding: 0;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 15px; height: 15px; border-radius: 50%;
    background: #8d92a5; transition: transform .15s, background .15s;
  }
  .switch.on { background: var(--accent); border-color: var(--accent); }
  .switch.on::after { transform: translateX(17px); background: #fff; }

  .btn {
    height: 28px; padding: 0 12px; border-radius: 8px; cursor: pointer;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); font: inherit; font-size: 12px;
    white-space: nowrap;
  }
  .btn:hover { background: #272a37; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #4d7ef2; }

  .divider { height: 1px; background: var(--border); margin: 6px 10px; }

  .footer {
    display: flex; align-items: center; gap: 8px; padding: 6px 14px 8px;
    border-top: 1px solid var(--border);
  }
  .footer .status { flex: 1; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .footer .status.ok { color: #56c271; }
  .footer .status.err { color: #e56767; }

  .proc-list { padding: 4px 0; }
  .proc-item { padding: 6px 10px; font-size: 12px; color: var(--text); border-radius: 6px; }
  .proc-item:hover { background: rgba(255,255,255,0.025); }
  .proc-item .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #56c271; margin-right: 8px; }
  .empty { padding: 20px 10px; text-align: center; color: var(--muted); font-size: 12px; }
  .ver { padding: 4px 10px; font-size: 10px; color: var(--muted); opacity: .6; text-align: center; }
</style>
</head>
<body>
<div class="app">
  <div class="titlebar" data-tauri-drag-region>
    <span class="brand" data-tauri-drag-region>ClipThis</span>
    <div class="spacer" data-tauri-drag-region></div>
    <button class="iconbtn" id="minbtn" title="Minimize to tray">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="capture">Capture</button>
    <button class="tab" data-tab="settings">Settings</button>
    <button class="tab" data-tab="about">About</button>
  </div>

  <!-- CAPTURE TAB -->
  <div class="panel on" id="tab-capture">
    <div class="row">
      <div class="lead">Hotkey<small>Press to set</small></div>
      <div class="ctl">
        <input type="text" id="hotkey" readonly placeholder="Click, then press keys" />
      </div>
    </div>
    <div class="row">
      <div class="lead">Clip length</div>
      <div class="ctl">
        <select id="clip_seconds">
          <option value="10">10s</option>
          <option value="15">15s</option>
          <option value="30">30s</option>
          <option value="60">60s</option>
          <option value="120">120s</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="lead">Format</div>
      <div class="ctl">
        <div class="seg" id="format">
          <button data-v="wav32">WAV 32</button>
          <button data-v="wav16">WAV 16</button>
          <button data-v="flac">FLAC</button>
          <button data-v="aac">AAC</button>
          <button data-v="adpcm">ADPCM</button>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="lead">Mic</div>
      <div class="ctl"><button class="switch" id="capture_mic" role="switch"></button></div>
    </div>
    <div class="divider"></div>
    <div class="proc-list" id="procs"></div>
  </div>

  <!-- SETTINGS TAB -->
  <div class="panel" id="tab-settings">
    <div class="row">
      <div class="lead">Output folder</div>
      <div class="ctl">
        <input type="text" id="output_dir" />
        <button class="btn" id="browse">Browse</button>
      </div>
    </div>
    <div class="row">
      <div class="lead">Autostart</div>
      <div class="ctl"><button class="switch" id="autostart" role="switch"></button></div>
    </div>
    <div class="row">
      <div class="lead">Notify on clip</div>
      <div class="ctl"><button class="switch" id="notify_clip" role="switch"></button></div>
    </div>
  </div>

  <!-- ABOUT TAB -->
  <div class="panel" id="tab-about">
    <div class="empty" id="ver">ClipThis</div>
    <div class="row">
      <div class="lead">Update</div>
      <div class="ctl"><button class="btn" id="update">Check for updates</button></div>
    </div>
  </div>

  <div class="footer">
    <div class="status" id="status">Ready</div>
    <button class="btn" id="clip">Clip now</button>
    <button class="btn primary" id="save">Save</button>
  </div>
</div>

<script>
  const { invoke } = window.__TAURI__.core;
  const $ = (id) => document.getElementById(id);
  const setStatus = (msg, kind) => {
    const el = $('status');
    el.textContent = msg;
    el.className = 'status' + (kind ? ' ' + kind : '');
  };

  // tabs
  document.querySelectorAll('.tab').forEach((t) => {
    t.onclick = () => {
      document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === t));
      document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('on', p.id === 'tab-' + t.dataset.tab));
    };
  });

  // drag
  document.querySelector('.titlebar').addEventListener('mousedown', (e) => {
    if (e.target.closest('button') || e.button !== 0) return;
    try { window.__TAURI__.window.getCurrentWindow().startDragging(); } catch {}
  });

  // switches
  function bindSwitch(id) {
    const el = $(id);
    el.addEventListener('click', () => el.classList.toggle('on'));
    return () => el.classList.contains('on');
  }
  const isAutostart = bindSwitch('autostart');
  const isNotify = bindSwitch('notify_clip');
  const isMic = bindSwitch('capture_mic');

  // format seg
  function bindSeg(id) {
    const seg = $(id);
    seg.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      [...seg.children].forEach((b) => b.classList.toggle('on', b === btn));
    });
    return () => { const on = seg.querySelector('button.on'); return on ? on.dataset.v : 'flac'; };
  }
  const getFormat = bindSeg('format');

  // hotkey capture — disabled while a clip hotkey import is active
  const hotkeyInput = $('hotkey');
  let capturing = false;
  let savedHotkey = '';
  hotkeyInput.addEventListener('focus', () => { capturing = true; savedHotkey = hotkeyInput.value; hotkeyInput.value = 'Press keys...'; });
  hotkeyInput.addEventListener('blur', () => { capturing = false; if (hotkeyInput.value === 'Press keys...') hotkeyInput.value = savedHotkey; });
  window.addEventListener('keydown', (e) => {
    if (!capturing) return;
    e.preventDefault(); e.stopPropagation();
    const parts = [];
    if (e.ctrlKey) parts.push('Ctrl');
    if (e.shiftKey) parts.push('Shift');
    if (e.altKey) parts.push('Alt');
    if (e.metaKey) parts.push('Win');
    const key = e.key;
    if (!['Control', 'Shift', 'Alt', 'Meta'].includes(key)) {
      let k = key.length === 1 ? key.toUpperCase() : key;
      if (k === ' ') k = 'Space';
      parts.push(k);
      hotkeyInput.value = parts.join('+');
      hotkeyInput.blur();
    }
  }, true);

  // load settings
  async function load() {
    const s = await invoke('get_settings');
    hotkeyInput.value = s.hotkey;
    $('output_dir').value = s.output_dir;
    $('clip_seconds').value = String(s.clip_seconds || 30);
    const fmt = s.format === 'wav' ? 'wav32' : s.format;
    [...$('format').children].forEach((b) => b.classList.toggle('on', b.dataset.v === fmt));
    $('autostart').classList.toggle('on', !!s.autostart);
    $('notify_clip').classList.toggle('on', s.notify_clip !== false);
    $('capture_mic').classList.toggle('on', !!s.capture_mic);
  }

  async function refreshProcs() {
    const ps = await invoke('list_processes');
    const el = $('procs');
    if (!ps.length) {
      el.innerHTML = '<div class="empty">Waiting for audio sources…</div>';
    } else {
      el.innerHTML = ps.map((p) => '<div class="proc-item"><span class="dot"></span>' + p.name + '</div>').join('');
    }
  }

  // idle auto-hide (60s)
  const IDLE_MS = 60000;
  let lastActive = Date.now();
  let busy = 0;
  const bump = () => { lastActive = Date.now(); };
  ['mousemove', 'mousedown', 'pointerdown', 'wheel', 'keydown', 'touchstart', 'focus'].forEach((ev) =>
    window.addEventListener(ev, bump, { passive: true })
  );
  setInterval(() => {
    if (busy > 0) { lastActive = Date.now(); return; }
    if (Date.now() - lastActive >= IDLE_MS) { lastActive = Date.now(); invoke('hide_to_tray'); }
  }, 2000);

  $('minbtn').onclick = () => invoke('hide_to_tray');

  $('browse').onclick = async () => {
    busy++;
    try { const f = await invoke('pick_folder'); if (f) $('output_dir').value = f; } finally { busy--; }
  };

  $('save').onclick = async () => {
    busy++;
    try {
      await invoke('set_settings', { settings: {
        hotkey: hotkeyInput.value,
        output_dir: $('output_dir').value,
        format: getFormat(),
        autostart: isAutostart(),
        notify_clip: isNotify(),
        capture_mic: isMic(),
        clip_seconds: parseInt($('clip_seconds').value, 10),
      }});
      setStatus('Saved', 'ok');
    } catch (e) { setStatus('Save failed: ' + e, 'err'); }
    finally { busy--; }
  };

  $('clip').onclick = async () => {
    busy++;
    setStatus('Clipping…');
    try {
      const folder = await invoke('trigger_clip');
      setStatus('Clipped → ' + folder.split('\\').pop(), 'ok');
    } catch (e) { setStatus('Clip failed: ' + e, 'err'); }
    finally { busy--; }
  };

  $('update').onclick = async () => {
    busy++;
    setStatus('Checking…');
    try {
      const info = await invoke('check_update');
      if (!info) { setStatus('Up to date', 'ok'); return; }
      if (!confirm('Update to ' + info.latest + '?\n\n' + info.notes)) return;
      setStatus('Downloading…');
      await invoke('apply_update', { url: info.url });
    } catch (e) { setStatus('Update failed: ' + e, 'err'); }
    finally { busy--; }
  };

  invoke('get_version').then((v) => { $('ver').textContent = 'ClipThis v' + v; }).catch(() => {});
  load();
  refreshProcs();
  setInterval(refreshProcs, 3000);
</script>
</body>
</html>
